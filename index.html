<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#eaf3ef" />
    <meta name="description" content="从参考地图重建独立 SVG 色块与 Three.js 圆柱几何的交互地图模板" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23b4e9cd' stroke='%23397b8a'/%3E%3Cpath d='M3 16h26M16 2c-10 9-10 19 0 28 10-9 10-19 0-28' fill='none' stroke='%23397b8a'/%3E%3C/svg%3E" />
    <title>幻想地图 · 环形档案</title>
    <script>document.documentElement.dataset.theme = localStorage.getItem("fantasy-map-theme") === "dark" ? "dark" : "light";</script>
  </head>
  <body>
    <main class="observatory" id="app">
      <header class="masthead hud" data-ui>
        <div><small>WORLD ARCHIVE / 001</small><h1>环形世界图</h1></div>
        <p>左右滑动探索 · 捏合或按住 ⌘ 滚动缩放 · 点击节点聚焦</p>
      </header>

      <section class="screen" id="screen" aria-label="可交互的幻想世界环形地图" tabindex="0">
        <canvas id="scene" aria-hidden="true"></canvas>
        <div class="archive-atmosphere" aria-hidden="true"></div>
        <div class="archive-scan" aria-hidden="true"></div>
        <div class="nodes" id="nodes" data-ui></div>
        <svg class="node-connection" id="node-connection" aria-hidden="true">
          <path id="node-connection-path"></path>
          <circle id="node-connection-origin" r="2.5"></circle>
        </svg>
        <div class="node-tooltip hud" id="node-tooltip" role="status" aria-live="polite"></div>
        <div class="vignette" aria-hidden="true"></div>

        <div class="viewport-controls hud" data-ui aria-label="地图视角控制">
          <button id="zoom-in" type="button" aria-label="放大地图">＋</button>
          <button id="zoom-out" type="button" aria-label="缩小地图">−</button>
          <button id="reset-view" type="button">RESET</button>
        </div>

        <aside class="city-panel hud" id="city-panel" data-ui aria-live="polite"></aside>
        <div class="author-tools hud" data-ui>
          <span id="author-position"></span>
        </div>
        <div class="author-snippet hud" id="author-snippet" data-ui>
          <code id="author-code"></code>
          <button id="author-copy" type="button">COPY CODE</button>
        </div>
        <div class="author-toast hud" id="author-toast" data-ui aria-live="polite"></div>
      </section>

      <nav class="node-rail hud" id="node-rail" data-ui aria-label="节点索引"></nav>
      <footer class="footer">
        <span class="footer-status"><i class="ready-lamp" aria-hidden="true"></i><span id="viewport-status">AZ 000.0° · ZOOM 100%</span><span id="cursor-status">X — · Y —</span></span>
        <span class="footer-note">7 NAMED · 59 DETECTED · MANUAL EDITOR READY</span>
        <span class="footer-actions">
          <button id="author-toggle" type="button">NODE EDITOR</button>
          <button id="theme-toggle" type="button" aria-label="切换深浅色模式">LIGHT / DARK</button>
        </span>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
